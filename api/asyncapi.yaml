# yaml-language-server: $schema=https://asyncapi.com/definitions/3.1.0/asyncapi.json
asyncapi: 3.1.0
info:
  title: Hermes WebSocket API
  version: 0.1.0
  description: |
    Signaling and realtime-event channel for Hermes.

    **Perspective.** This document describes the **server** (`apps/server`).
    `receive` operations are frames the server accepts from a client;
    `send` operations are frames the server pushes to a client.

    **Wire format.** Every application frame is a **binary** WebSocket frame
    containing a protobuf-encoded `hermes.Envelope`
    ([api/proto/hermes.proto](./proto/hermes.proto)). The envelope carries
    `envelopeId` / `timestamp` / `version` plus exactly one `payload` member —
    the `oneof` tag is what selects the message type below. The payload schemas
    here are the proto3-JSON projection of those messages, provided for
    documentation only; nothing on the wire is JSON.

    **Write path.** The socket is **read-only for chat messages**. They are
    created, edited, and deleted over REST
    (`POST` / `PATCH` / `DELETE /api/v1/channel/{channel}/message`), which is
    where permission checks, validation, and rate limiting live. The server then
    announces the result as `messageCreate` / `messageUpdate` / `messageDelete`
    so peers can update their caches without polling. There is deliberately no
    client → server message-write frame; a second write path would mean
    duplicating every check.

    The same rule generalizes: a client → server frame exists only for state
    with no durable REST representation — voice membership, typing, and the
    caller's own presence.

    **Liveness.** There is no application-level ping/pong. Liveness uses the
    standard WebSocket control frames: the server answers a client `Ping` with
    a `Pong`.

    **Text frames** are echoed back verbatim and carry no application meaning.

    **Relay model.** Voice is a peer mesh; the server never touches media. It
    only fans out voice-channel membership changes and relays SDP / ICE between
    peers, which is why the RTC messages appear in both directions with
    different `target` semantics (see each message).

    **Implementation status.** The payload contract below is complete, but the
    server side is not. As of this revision
    [`websocket.rs`](../apps/server/src/routes/websocket.rs) authenticates the
    handshake, decodes inbound envelopes, and logs them — nothing more. There is
    no session registry, so no `2XX` frame is ever sent and no fan-out happens.
    Presence in particular cannot work until that registry exists, because
    online/offline is derived from connection state rather than stored. The
    scoped presence REST endpoints referenced under `sendPresenceEvent` do not
    exist yet either.

defaultContentType: application/x-protobuf

servers:
  local:
    host: localhost:7433
    protocol: ws
    title: Local dev (direct)
    summary: Actix server bound to 0.0.0.0:7433, no TLS.
    security:
      - $ref: '#/components/securitySchemes/bearerSubprotocol'
  localTls:
    host: localhost
    protocol: wss
    title: Local dev (Caddy TLS front)
    summary: Caddy terminates TLS and proxies to the server.
    description: |
      Started with `pnpm dev:caddy`; see
      [configs/dev/Caddyfile](../configs/dev/Caddyfile).
    security:
      - $ref: '#/components/securitySchemes/bearerSubprotocol'
  production:
    host: '{host}'
    protocol: wss
    title: Deployment
    variables:
      host:
        default: hermes.example.com
        description: Origin the client is configured with via `VITE_SERVER_URL`.
    security:
      - $ref: '#/components/securitySchemes/bearerSubprotocol'

channels:
  hermes:
    address: /api/ws
    title: Hermes realtime channel
    summary: Single bidirectional channel carrying every `hermes.Envelope`.
    description: |
      One connection per signed-in client. The handshake is rejected with
      `401` unless a valid access token rides along on the subprotocol header
      (see the `bearerSubprotocol` security scheme). The connection is
      identified by the token's `sub` claim; that user id is what other clients
      see as `userId` / `target`.

      A user may hold **several** connections at once (desktop, browser, second
      machine). Presence is reported per **user**, not per connection: the
      effective status is the highest-priority status across that user's live
      sessions, and a user only goes `OFFLINE` when the last one closes.
    bindings:
      ws:
        bindingVersion: 0.1.0
        method: GET
        headers:
          type: object
          required:
            - Sec-WebSocket-Protocol
          properties:
            Sec-WebSocket-Protocol:
              type: string
              pattern: '^bearer, .+$'
              description: |
                Exactly two comma-separated tokens: the literal `bearer`
                followed by the JWT access token. Any other shape is a `401`.
              examples:
                - 'bearer, eyJhbGciOiJFZERTQSIsImtpZCI6Ii4uLiJ9...'
    messages:
      # Client -> Server (proto field numbers 1X / 1XX)
      voiceChannelRequest:
        $ref: '#/components/messages/voiceChannelRequest'
      rtcSignalRequest:
        $ref: '#/components/messages/rtcSignalRequest'
      rtcIceCandidateRequest:
        $ref: '#/components/messages/rtcIceCandidateRequest'
      typingEventRequest:
        $ref: '#/components/messages/typingEventRequest'
      presenceEventRequest:
        $ref: '#/components/messages/presenceEventRequest'
      # Server -> Client (proto field numbers 1X / 2XX)
      voiceChannelEvent:
        $ref: '#/components/messages/voiceChannelEvent'
      rtcSignal:
        $ref: '#/components/messages/rtcSignal'
      rtcIceCandidate:
        $ref: '#/components/messages/rtcIceCandidate'
      messageCreate:
        $ref: '#/components/messages/messageCreate'
      messageUpdate:
        $ref: '#/components/messages/messageUpdate'
      messageDelete:
        $ref: '#/components/messages/messageDelete'
      typingEvent:
        $ref: '#/components/messages/typingEvent'
      presenceEvent:
        $ref: '#/components/messages/presenceEvent'

operations:
  # ---------------------------------------------------------------- inbound --
  onVoiceChannelRequest:
    action: receive
    title: Join / leave a voice channel
    channel:
      $ref: '#/channels/hermes'
    summary: Client asks to enter or exit a voice channel.
    description: |
      The server updates membership and fans the change out to every other
      member of that channel as a `voiceChannelEvent`. The requester is
      identified by the connection, not by the payload.
    messages:
      - $ref: '#/channels/hermes/messages/voiceChannelRequest'

  onRtcSignalRequest:
    action: receive
    title: Relay an SDP description to a peer
    channel:
      $ref: '#/channels/hermes'
    summary: Offer / answer bound for one specific peer.
    description: |
      `target` is the **destination** user id. The server forwards the payload
      to that user's connection as `rtcSignal`, rewriting `target` to the
      **sender's** user id so the receiver knows who to answer.
    messages:
      - $ref: '#/channels/hermes/messages/rtcSignalRequest'

  onRtcIceCandidateRequest:
    action: receive
    title: Relay an ICE candidate to a peer
    channel:
      $ref: '#/channels/hermes'
    description: |
      Trickle ICE. Same relay + `target` rewrite rule as `onRtcSignalRequest`.
    messages:
      - $ref: '#/channels/hermes/messages/rtcIceCandidateRequest'

  onTypingEventRequest:
    action: receive
    title: Typing indicator
    channel:
      $ref: '#/channels/hermes'
    summary: Client reports that its user is composing in a channel.
    description: |
      Payload is `TypingRequest { channelId }` — **only** the channel id. The
      typing user comes from the connection, and the server derives the owning
      server id from the channel, because it has to resolve the channel to
      authorize the frame anyway (`channel_permissions`, which 404s an unknown
      channel and 403s a server channel the caller cannot `VIEW_CHANNELS`).
      A client-supplied `serverId` would be a spoofing surface that buys
      nothing, and DM channels have no server id at all.

      Fanned out to that channel's other members as `typingEvent`.

      **Lifetime is a TTL, not a stop frame.** There is no `STOP`. The client
      re-sends roughly once per second while the composer is non-empty and
      simply stops sending when it isn't; the server stamps each `typingEvent`
      with `expiresAt` about five seconds out. Receivers clear the indicator at
      `expiresAt`, and additionally clear it early when that same user's
      `messageCreate` arrives. This self-heals: a client that crashes or drops
      its socket mid-word cannot leave a stuck indicator behind, which an
      explicit `STOP` frame would.

      The server is expected to rate-limit re-sends per user per channel rather
      than trusting the client's throttle.
    messages:
      - $ref: '#/channels/hermes/messages/typingEventRequest'

  onPresenceEventRequest:
    action: receive
    title: Set own presence status
    channel:
      $ref: '#/channels/hermes'
    summary: Client sets the status its user should appear as.
    description: |
      Payload is `PresenceUpdateRequest { status, customText? }`. It sets the
      **caller's own** status only; there is no way to set another user's, and
      no subscription toggle — see `sendPresenceEvent` for how a client learns
      about others.

      Two values in `PresenceStatus` are not symmetric between request and
      event:

      - `PRESENCE_STATUS_INVISIBLE` is accepted here, stored against the
        session, and then broadcast to everyone else as
        `PRESENCE_STATUS_OFFLINE`. It must never appear in a `presenceEvent`.
      - `PRESENCE_STATUS_OFFLINE` is **not settable**. It is derived: the
        server emits it when a user's last connection closes.

      `PRESENCE_STATUS_UNSPECIFIED` is the proto3 default and means the field
      was absent; treat it as a malformed request rather than a status.

      Because a user may be connected several times over, the server resolves
      one effective status per user before fanning out, rather than emitting
      one event per session.
    messages:
      - $ref: '#/channels/hermes/messages/presenceEventRequest'

  # --------------------------------------------------------------- outbound --
  sendVoiceChannelEvent:
    action: send
    title: Voice channel membership changed
    channel:
      $ref: '#/channels/hermes'
    description: |
      Sent to every other member of the channel when a user joins or leaves.
      On `JOIN`, existing members are expected to create an offer for
      `userId` and start negotiating; on `LEAVE`, to tear that peer connection
      down.
    messages:
      - $ref: '#/channels/hermes/messages/voiceChannelEvent'

  sendRtcSignal:
    action: send
    title: SDP description relayed from a peer
    channel:
      $ref: '#/channels/hermes'
    description: |
      `target` is the **originating** user id — the peer this description came
      from, and the peer any reply should be addressed to.
    messages:
      - $ref: '#/channels/hermes/messages/rtcSignal'

  sendRtcIceCandidate:
    action: send
    title: ICE candidate relayed from a peer
    channel:
      $ref: '#/channels/hermes'
    description: |
      `target` is the **originating** user id. Candidates may arrive before the
      matching description; clients should buffer until the remote description
      is set.
    messages:
      - $ref: '#/channels/hermes/messages/rtcIceCandidate'

  sendMessageCreate:
    action: send
    title: Chat message created
    channel:
      $ref: '#/channels/hermes'
    summary: A message was posted to a channel the recipient can see.
    description: |
      Emitted as a side effect of a successful
      `POST /api/v1/channel/{channel}/message`, to every other connected member
      of that channel who holds `VIEW_CHANNELS`.

      The frame carries the **whole message**, not a pointer, so a client can
      render it without a follow-up fetch — a refetch per inbound message would
      be a thundering herd on a busy channel. Recipients should write it
      straight into their cached message list.

      The author's own client generally already has the message from the REST
      response it is awaiting, so it should reconcile by message id rather than
      appending blindly, or it will double-render its own post.

      This frame also implicitly clears any typing indicator held for
      `message.userId` in `message.channelId`.
    messages:
      - $ref: '#/channels/hermes/messages/messageCreate'

  sendMessageUpdate:
    action: send
    title: Chat message edited
    channel:
      $ref: '#/channels/hermes'
    description: |
      Emitted after a successful `PATCH /api/v1/channel/{channel}/message/{id}`.
      Carries the full post-edit message; `editedAt` is set. Same audience as
      `sendMessageCreate`. Replace by `message.id`.
    messages:
      - $ref: '#/channels/hermes/messages/messageUpdate'

  sendMessageDelete:
    action: send
    title: Chat message deleted
    channel:
      $ref: '#/channels/hermes'
    description: |
      Emitted after a successful
      `DELETE /api/v1/channel/{channel}/message/{id}`. Ids only — there is no
      body to deliver. Deletion is **soft** server-side (`deleted_at` is set and
      the row is filtered out of listings), but recipients should treat this as
      a removal.
    messages:
      - $ref: '#/channels/hermes/messages/messageDelete'

  sendTypingEvent:
    action: send
    title: Someone is typing
    channel:
      $ref: '#/channels/hermes'
    description: |
      Fan-out of `onTypingEventRequest` to the channel's other members, never
      echoed to the originator. `serverId` is absent for DM channels.

      `expiresAt` is authoritative — the receiver arms a timer against it rather
      than assuming a fixed duration, so the window can be adjusted server-side
      without a client release. Clear early on that user's `messageCreate`.
    messages:
      - $ref: '#/channels/hermes/messages/typingEvent'

  sendPresenceEvent:
    action: send
    title: Presence changed
    channel:
      $ref: '#/channels/hermes'
    summary: One or more users' effective presence changed.
    description: |
      **Deltas only.** This frame reports changes; it is not a roster snapshot
      and is never sent on connect.

      Bulk presence is fetched over REST, scoped to whatever UI needs it — the
      member list of a server the user is viewing, or their friends list —
      rather than shipping a global roster the client mostly ignores.

      `presences` is `repeated` so one frame can carry a coalesced burst (a user
      closing three sessions at once, or a batch of members resolving after a
      reconnect) using the same shape as a single-user delta.

      Recipients are connected users who share a server with, or are friends
      with, the changed user. `PRESENCE_STATUS_INVISIBLE` never appears here —
      it arrives as `PRESENCE_STATUS_OFFLINE`.
    messages:
      - $ref: '#/channels/hermes/messages/presenceEvent'

components:
  securitySchemes:
    bearerSubprotocol:
      type: httpApiKey
      name: Sec-WebSocket-Protocol
      in: header
      description: |
        The access token rides on the WebSocket subprotocol header rather than
        the query string, so it never lands in access logs, `Referer`, or proxy
        caches:

        ```
        Sec-WebSocket-Protocol: bearer, <jwt>
        ```

        Browsers send this automatically from
        `new WebSocket(url, ["bearer", token])`. The server validates the JWT
        (Ed25519, verifiable against `/.well-known/jwks.json`) and echoes
        `Sec-WebSocket-Protocol: bearer` on the 101 response, as RFC 6455
        §4.2.2 requires. A missing header, a wrong shape, or an invalid token
        fails the handshake with `401` before the upgrade.

  messages:
    # ------------------------------------------------------ client -> server --
    voiceChannelRequest:
      name: voiceChannelRequest
      title: Voice channel join/leave request
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.voiceChannelRequest (field 100)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - voiceChannelRequest
            properties:
              voiceChannelRequest:
                $ref: '#/components/schemas/VoiceChannelRequest'

    rtcSignalRequest:
      name: rtcSignalRequest
      title: Outbound SDP description
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.rtc (field 10)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - rtc
            properties:
              rtc:
                allOf:
                  - $ref: '#/components/schemas/RtcEvent'
                  - properties:
                      target:
                        description: User id of the peer this description is for.

    rtcIceCandidateRequest:
      name: rtcIceCandidateRequest
      title: Outbound ICE candidate
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.rtcIce (field 11)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - rtcIce
            properties:
              rtcIce:
                allOf:
                  - $ref: '#/components/schemas/RtcNewCandidate'
                  - properties:
                      target:
                        description: User id of the peer this candidate is for.

    typingEventRequest:
      name: typingEventRequest
      title: Typing indicator request
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.typingEventRequest (field 102)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - typingEventRequest
            properties:
              typingEventRequest:
                $ref: '#/components/schemas/TypingRequest'

    presenceEventRequest:
      name: presenceEventRequest
      title: Presence status update
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.presenceEventRequest (field 101)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - presenceEventRequest
            properties:
              presenceEventRequest:
                $ref: '#/components/schemas/PresenceUpdateRequest'

    # ------------------------------------------------------ server -> client --
    voiceChannelEvent:
      name: voiceChannelEvent
      title: Voice channel membership change
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.voiceChannelEvent (field 200)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - voiceChannelEvent
            properties:
              voiceChannelEvent:
                $ref: '#/components/schemas/VoiceChannelUserEvent'

    rtcSignal:
      name: rtcSignal
      title: Relayed SDP description
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.rtc (field 10)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - rtc
            properties:
              rtc:
                allOf:
                  - $ref: '#/components/schemas/RtcEvent'
                  - properties:
                      target:
                        description: |
                          User id of the peer this description came from. Reply
                          addressed back to this id.

    rtcIceCandidate:
      name: rtcIceCandidate
      title: Relayed ICE candidate
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.rtcIce (field 11)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - rtcIce
            properties:
              rtcIce:
                allOf:
                  - $ref: '#/components/schemas/RtcNewCandidate'
                  - properties:
                      target:
                        description: User id of the peer this candidate came from.

    messageCreate:
      name: messageCreate
      title: Chat message created
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.messageCreate (field 203)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - messageCreate
            properties:
              messageCreate:
                $ref: '#/components/schemas/MessageEvent'

    messageUpdate:
      name: messageUpdate
      title: Chat message edited
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: |
          hermes.Envelope.messageUpdate (field 204). Shares the `MessageEvent`
          payload type with field 203; the `oneof` tag is what distinguishes a
          create from an edit.
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - messageUpdate
            properties:
              messageUpdate:
                $ref: '#/components/schemas/MessageEvent'

    messageDelete:
      name: messageDelete
      title: Chat message deleted
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.messageDelete (field 205)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - messageDelete
            properties:
              messageDelete:
                $ref: '#/components/schemas/MessageDeleteEvent'

    typingEvent:
      name: typingEvent
      title: Someone is typing
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.typingEvent (field 202)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - typingEvent
            properties:
              typingEvent:
                $ref: '#/components/schemas/TypingEvent'

    presenceEvent:
      name: presenceEvent
      title: Presence changed
      contentType: application/x-protobuf
      correlationId:
        $ref: '#/components/correlationIds/envelopeId'
      externalDocs:
        description: hermes.Envelope.presenceEvent (field 201)
        url: file:./proto/hermes.proto
      payload:
        allOf:
          - $ref: '#/components/schemas/EnvelopeHeader'
          - type: object
            required:
              - presenceEvent
            properties:
              presenceEvent:
                $ref: '#/components/schemas/PresenceEvent'

  correlationIds:
    envelopeId:
      location: $message.payload#/envelopeId
      description: |
        Per-envelope id. Client envelopes carry a nanoid; a relayed or
        broadcast envelope is a new envelope with its own id, so this
        correlates a frame with its log line, not a request with a response —
        there is no ack or error message in the protocol today. A rejected
        request (unknown channel, missing permission, rate limit) is dropped
        silently, which is indistinguishable to the client from a request that
        succeeded but had no recipients.

  schemas:
    EnvelopeHeader:
      type: object
      title: hermes.Envelope (header fields)
      description: |
        Fields every envelope carries alongside exactly one `payload` member.
      required:
        - envelopeId
        - timestamp
        - version
      properties:
        envelopeId:
          type: string
          description: Unique id for this envelope (client side uses `nanoid`).
          examples:
            - V1StGXR8_Z5jdHi6B-myT
        timestamp:
          type: integer
          format: int64
          description: Unix epoch milliseconds at which the envelope was created.
        version:
          type: integer
          format: int32
          minimum: 0
          description: Envelope schema version. Currently always `1`.

    VoiceChannelRequest:
      type: object
      title: hermes.VoiceChannelRequest
      description: Client → server request to join or leave a voice channel.
      required:
        - channelId
        - type
      properties:
        channelId:
          type: string
          description: Voice channel to act on.
        type:
          $ref: '#/components/schemas/VoiceChannelEventType'

    VoiceChannelUserEvent:
      type: object
      title: hermes.VoiceChannelUserEvent
      description: Server → client notice that a user's voice membership changed.
      required:
        - channelId
        - type
        - userId
      properties:
        channelId:
          type: string
        type:
          $ref: '#/components/schemas/VoiceChannelEventType'
        userId:
          type: string
          description: The user who joined or left — the peer to negotiate with.

    VoiceChannelEventType:
      type: string
      title: hermes.VoiceChannelEventType
      description: |
        Proto enum; wire values: `VOICE_CHANNEL_EVENT_TYPE_UNSPECIFIED` = 0,
        `..._JOIN` = 1, `..._LEAVE` = 2. Zero is reserved for "field absent" so
        an unset `type` cannot be mistaken for a join.
      enum:
        - VOICE_CHANNEL_EVENT_TYPE_UNSPECIFIED
        - VOICE_CHANNEL_EVENT_TYPE_JOIN
        - VOICE_CHANNEL_EVENT_TYPE_LEAVE

    RtcEvent:
      type: object
      title: hermes.RtcEvent
      description: A WebRTC session description being relayed between two peers.
      required:
        - type
        - target
        - sdp
      properties:
        type:
          $ref: '#/components/schemas/RtcMessageType'
        target:
          type: string
          description: |
            The other end of the relay. Outbound: the destination peer.
            Inbound: the originating peer.
        sdp:
          type: string
          description: The SDP body of the local description.

    RtcMessageType:
      type: string
      title: hermes.RtcEvent.RtcMessageType
      description: |
        Proto enum mirroring `RTCSdpType`; wire values: `UNSPECIFIED` = 0,
        `Offer` = 1, `Answer` = 2, `PrAnswer` = 3, `Rollback` = 4. Only `Offer`
        and `Answer` are handled by the desktop client today — the other two
        throw.
      enum:
        - UNSPECIFIED
        - Offer
        - Answer
        - PrAnswer
        - Rollback

    RtcNewCandidate:
      type: object
      title: hermes.RtcNewCandidate
      description: A trickled ICE candidate being relayed between two peers.
      required:
        - target
        - candidate
      properties:
        target:
          type: string
          description: |
            The other end of the relay. Outbound: the destination peer.
            Inbound: the originating peer.
        candidate:
          $ref: '#/components/schemas/IceCandidate'

    IceCandidate:
      type: object
      title: hermes.RtcNewCandidate.IceCandidate
      description: |
        Field-for-field projection of the browser's `RTCIceCandidateInit`. All
        members are `optional` in proto; absence is meaningful (e.g. an empty
        `candidate` marks end-of-candidates).
      properties:
        candidate:
          type: string
        sdpMid:
          type: string
        sdpMLineIndex:
          type: integer
          format: int64
        usernameFragment:
          type: string

    TypingRequest:
      type: object
      title: hermes.TypingRequest
      description: |
        Client → server typing notice. Deliberately minimal: the user comes from
        the connection and the server id is derived from the channel during the
        permission check, so neither is accepted from the client.
      required:
        - channelId
      properties:
        channelId:
          type: string
          description: Channel the user is composing in. May be a DM channel.

    TypingEvent:
      type: object
      title: hermes.TypingEvent
      description: |
        Server → client typing indicator, fanned out to the channel's other
        members.
      required:
        - userId
        - channelId
        - expiresAt
      properties:
        userId:
          type: string
          description: The user who is typing.
        serverId:
          type: string
          description: |
            Owning server of `channelId`. Absent for DM channels, which have no
            server. Derived server-side; clients could look it up from their
            channel list, but it is included to save the lookup when routing to
            UI state.
        channelId:
          type: string
        expiresAt:
          type: integer
          format: int64
          description: |
            Unix epoch milliseconds after which the indicator must be cleared,
            roughly five seconds out. Authoritative — arm a timer against this
            rather than assuming a fixed window. Also clear early if this user's
            `messageCreate` arrives first.

    PresenceStatus:
      type: string
      title: hermes.PresenceStatus
      description: |
        Wire values: `PRESENCE_STATUS_UNSPECIFIED` = 0, `..._ONLINE` = 1,
        `..._IDLE` = 2, `..._DND` = 3, `..._INVISIBLE` = 4, `..._OFFLINE` = 5.

        Two are direction-specific:

        - `..._INVISIBLE` is **request-only**. Accepted from a client, but
          broadcast to others as `..._OFFLINE`; it must never appear in a
          `presenceEvent`.
        - `..._OFFLINE` is **event-only**. Not settable; derived by the server
          when a user's last connection closes.

        `..._UNSPECIFIED` is the proto3 default, meaning the field was absent.
        It is not a status — treat it as a malformed frame.
      enum:
        - PRESENCE_STATUS_UNSPECIFIED
        - PRESENCE_STATUS_ONLINE
        - PRESENCE_STATUS_IDLE
        - PRESENCE_STATUS_DND
        - PRESENCE_STATUS_INVISIBLE
        - PRESENCE_STATUS_OFFLINE

    PresenceUpdateRequest:
      type: object
      title: hermes.PresenceUpdateRequest
      description: |
        Client → server request setting the **caller's own** status. The subject
        is the connection's user; there is no way to set another user's status.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PresenceStatus'
        customText:
          type: string
          description: Optional free-text status line shown beside the name.

    UserPresence:
      type: object
      title: hermes.UserPresence
      description: |
        One user's effective presence — resolved across all of that user's live
        sessions, not reported per connection.
      required:
        - userId
        - status
      properties:
        userId:
          type: string
        status:
          $ref: '#/components/schemas/PresenceStatus'
        customText:
          type: string

    PresenceEvent:
      type: object
      title: hermes.PresenceEvent
      description: |
        Server → client presence **delta**. Never a snapshot: bulk presence is
        fetched over REST, scoped to the UI that needs it. `presences` is
        repeated so a burst can be coalesced into one frame using the same shape
        as a single change.
      required:
        - presences
      properties:
        presences:
          type: array
          items:
            $ref: '#/components/schemas/UserPresence'

    ChatMessage:
      type: object
      title: hermes.ChatMessage
      description: |
        A chat message body, mirroring the REST `Message` schema in
        [api/openapi.yaml](./openapi.yaml).

        The timestamps are **strings**, not the int64 epoch milliseconds used by
        `Envelope.timestamp`. That is deliberate: they carry the same
        serialization the REST endpoints emit, so a message arriving over the
        socket and the same message fetched over HTTP produce an identical
        client-side object and can share one cache entry without a normalizing
        layer. The two schemas are kept in sync by hand — changing one means
        changing the other.
      required:
        - id
        - channelId
        - content
        - createdAt
      properties:
        id:
          type: string
          description: Chat message id (distinct from `Envelope.envelopeId`).
        channelId:
          type: string
        userId:
          type: string
          description: |
            Author. Absent when the author's account was deleted — the column is
            `ON DELETE SET NULL`, so historical messages outlive their authors.
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          description: Absent unless the message has been edited.

    MessageEvent:
      type: object
      title: hermes.MessageEvent
      description: |
        Server → client fan-out of a chat message create or edit. Shared by
        `Envelope.messageCreate` (203) and `Envelope.messageUpdate` (204) — the
        `oneof` tag distinguishes them, not a discriminator field.
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
        serverId:
          type: string
          description: |
            Owning server of `message.channelId`. Absent for DM channels.

    MessageDeleteEvent:
      type: object
      title: hermes.MessageDeleteEvent
      description: |
        Server → client fan-out of a chat message deletion. Ids only; there is
        no body left to send.
      required:
        - id
        - channelId
      properties:
        id:
          type: string
          description: Id of the deleted chat message.
        channelId:
          type: string
        serverId:
          type: string
          description: |
            Owning server of `channelId`. Absent for DM channels.
