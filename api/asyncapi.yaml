# yaml-language-server: $schema=https://asyncapi.com/definitions/3.1.0/asyncapi.json
asyncapi: 3.1.0
info:
  title: Hermes Websockets API
  version: 0.1.0
  description: |
    Hermes chat api websocket api definition
channels:
  hermesServer:
    address: /
    messages:
      ping:
        $ref: '#/components/messages/ping'
      pong:
        $ref: '#/components/messages/pong'
operations:
  sendTextMessage:
    action: send
    channel:
      $ref: '#/channels/hermesServer'
  sendTyping:
    action: send
    channel:
      $ref: '#/channels/hermesServer'
  sendJoinRoom:
    action: send
    channel:
      $ref: '#/channels/hermesServer'
  sendLeaveRoom:
    action: send
    channel:
      $ref: '#/channels/hermesServer'
  sendRtcOffer:
    action: send
    channel:
      $ref: '#/channels/hermesServer'
  sendRtcAnswer:
    action: send
    channel:
      $ref: '#/channels/hermesServer
  reveiveChannelEvent:
    action: receive
    channel:
      $ref: '#/channels/hermesServer'
  receiveRoomEvent:
    action: receive
    channel:
      $ref: '#/channels/hermesServer'
  receiveUserJoinRoom:
    action: receive
    channel:
      $ref: '#/channels/hermesServer'
  receiveUserLeaveRoom:
    action: receive
    channel:
      $ref: '#/channels/hermesServer'
  receiveRtcOffer:
    action: receive
    channel:
      $ref: '#/channels/hermesServer'
  receiveRtcAnswer:
    action: receive
    channel:
      $ref: '#/channels/hermesServer'
  receivePing:
    action: receive
    channel:
      $ref: '#/channels/hermesServer'
    reply:
      channel:
        $ref: '#/channels/hermesServer'
      messages:
        - $ref: '#/channels/hermesServer/messages/pong'
    messages:
      - $ref: '#/channels/hermesServer/messages/ping'
components:
  messages:
    ping:
      summary: Ping server to determine whether connection is alive
      description: >-
        Client can ping server to determine whether connection is alive, server
        responds with pong. This is an application level ping as opposed to
        default ping in websockets standard which is server initiated
      payload:
        $ref: '#/components/schemas/ping'
      correlationId:
        location: $message.payload#/reqid
    pong:
      summary: Pong is a response to ping message
      description: >-
        Server pong response to a ping to determine whether connection is alive.
        This is an application level pong as opposed to default pong in
        websockets standard which is sent by client in response to a ping
      payload:
        $ref: '#/components/schemas/pong'
      correlationId:
        location: $message.payload#/reqid
      description: >-
        Server heartbeat sent if no subscription traffic within 1 second
        (approximately)
      payload:
        $ref: '#/components/schemas/heartbeat'
  schemas:
    ping:
      type: object
      properties:
        event:
          type: string
          const: ping
        reqid:
          $ref: '#/components/schemas/reqid'
      required:
        - event
    pong:
      type: object
      properties:
        event:
          type: string
          const: pong
        reqid:
          $ref: '#/components/schemas/reqid'
    reqid:
      type: integer
      description: client originated ID reflected in response message.

