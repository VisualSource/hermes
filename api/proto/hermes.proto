syntax = "proto3";

package hermes;

message Envelope {
    string envelopeId = 1;
    int64 timestamp = 2;
    uint32 version = 3;
  
    oneof payload {
        // RTC 1X
        RtcEvent rtc = 10;
        RtcNewCandidate rtcIce = 11;

        // Client -> Server 1XX
        VoiceChannelRequest    voiceChannelRequest =  100;
        PresenceUpdateRequest  presenceEventRequest = 101;
        TypingRequest          typingEventRequest  =  102;
      

        // Server -> Client 2XX
        VoiceChannelUserEvent voiceChannelEvent = 200;
        PresenceEvent         presenceEvent     = 201;
        TypingEvent           typingEvent       = 202;
        MessageEvent           messageCreate     = 203;
        MessageEvent           messageUpdate     = 204;
        MessageDeleteEvent     messageDelete     = 205;
    }
}

// shared
enum PresenceStatus {
    PRESENCE_STATUS_UNSPECIFIED = 0;
    PRESENCE_STATUS_ONLINE      = 1;
    PRESENCE_STATUS_IDLE        = 2;
    PRESENCE_STATUS_DND         = 3;
    PRESENCE_STATUS_INVISIBLE   = 4;
    PRESENCE_STATUS_OFFLINE     = 5;
}
enum VoiceChannelEventType {
   VOICE_CHANNEL_EVENT_TYPE_UNSPECIFIED = 0;
   VOICE_CHANNEL_EVENT_TYPE_JOIN = 1;
   VOICE_CHANNEL_EVENT_TYPE_LEAVE = 2;
}

// Client -> Server 1XX
message PresenceUpdateRequest {
    PresenceStatus status = 1;
    optional string customText = 2;
}
message TypingRequest {
    string channelId = 1;
}
message VoiceChannelRequest {
    string channelId = 1;
    VoiceChannelEventType type = 2;
}

// Server -> Client 2XX
message VoiceChannelUserEvent {
    string channelId = 1;
    VoiceChannelEventType type = 2;
    string userId = 3;
}
message TypingEvent {
    string userId            = 1;
    optional string serverId = 2;
    string channelId         = 3;
    int64  expiresAt         = 4;
}
message UserPresence {
    string userId = 1;
    PresenceStatus status = 2;
    optional string customText = 3;
}
message PresenceEvent {
    repeated UserPresence presences = 1;
}
message ChatMessage {
    string id = 1;
    string channelId = 2;
    optional string userId = 3;
    string content = 4;
    string createdAt = 5;
    optional string editedAt = 6;
}
message MessageEvent {
    ChatMessage message = 1;
    optional string serverId = 2;
}
message MessageDeleteEvent {
    string id = 1;
    string channelId = 2;
    optional string serverId = 3;
}

// RTC 1X
message RtcEvent {
    enum RtcMessageType {
        UNSPECIFIED = 0;
        Offer = 1;
        Answer = 2;
        PrAnswer = 3;
        Rollback = 4;
    }

    RtcMessageType type = 1;
    string target = 2;
    string sdp = 3;
}

message RtcNewCandidate {
    message IceCandidate {
        optional string candidate = 1;
        optional string sdpMid = 2;
        optional int64 sdpMLineIndex = 3;
        optional string usernameFragment = 4;
    }

    string target = 1;
    IceCandidate candidate = 2;
}