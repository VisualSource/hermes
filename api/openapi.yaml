components:
  schemas:
    ApplicationError:
      type: object
      required:
      - code
      - message
      - target
      - details
      properties:
        code:
          type: integer
          format: int32
          minimum: 0
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        innererror:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InnerError'
        message:
          type: string
        target:
          type: string
    Channel:
      type: object
      required:
      - id
      - kind
      - name
      properties:
        category:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChannelKind'
        name:
          type: string
        server_id:
          type:
          - string
          - 'null'
          format: uuid
    ChannelKind:
      type: string
      enum:
      - text
      - voice
      - dm
    CreateChannelPayload:
      type: object
      required:
      - name
      - kind
      properties:
        category:
          type:
          - string
          - 'null'
        kind:
          $ref: '#/components/schemas/ChannelKind'
        name:
          type: string
    CreateFriendRequestPayload:
      type: object
      required:
      - user
      properties:
        user:
          type: string
          format: uuid
    CreateInvitePayload:
      type: object
      properties:
        max_uses:
          type:
          - integer
          - 'null'
          format: int64
    CreateRolePayload:
      type: object
      required:
      - name
      properties:
        bg_color:
          type:
          - string
          - 'null'
        fg_color:
          type:
          - string
          - 'null'
        mask:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        name:
          type: string
    DmParticipant:
      type: object
      description: link info for a channel(dm)
      required:
      - channel_id
      - user_a_id
      - user_b_id
      properties:
        channel_id:
          type: string
          format: uuid
        user_a_id:
          type: string
          format: uuid
        user_b_id:
          type: string
          format: uuid
    ErrorDetail:
      type: object
      required:
      - code
      - target
      - message
      properties:
        code:
          type: integer
          format: int32
          minimum: 0
        message:
          type: string
        target:
          type: string
    FriendRequest:
      type: object
      required:
      - id
      - from_user
      - to_user
      - rejected
      properties:
        from_user:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        rejected:
          type: boolean
        to_user:
          type: string
          format: uuid
    InnerError:
      type: object
      required:
      - trace
      properties:
        trace:
          type: array
          items:
            type: string
    Invite:
      type: object
      required:
      - id
      - server_id
      - max_uses
      - uses
      - revoked
      properties:
        created_by:
          type:
          - string
          - 'null'
          format: uuid
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
        max_uses:
          type: integer
          format: int64
        revoked:
          type: boolean
        server_id:
          type: string
          format: uuid
        uses:
          type: integer
          format: int64
    Message:
      type: object
      required:
      - id
      - channel_id
      - content
      - created_at
      properties:
        channel_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        user_id:
          type:
          - string
          - 'null'
          format: uuid
    MessageQueryResult:
      type: object
      required:
      - results
      - count
      properties:
        count:
          type: integer
          minimum: 0
        cursor:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    PatchChannelPayload:
      type: object
      properties:
        category:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    PatchMessagePayload:
      type: object
      required:
      - content
      properties:
        content:
          type: string
    PatchRolePayload:
      type: object
      properties:
        bg_color:
          type:
          - string
          - 'null'
        fg_color:
          type:
          - string
          - 'null'
        mask:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        name:
          type:
          - string
          - 'null'
    PatchServerPayload:
      type: object
      properties:
        icon:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    PostJoinServerPayload:
      type: object
      required:
      - invite_code
      properties:
        invite_code:
          type: string
    PostKickUserPayload:
      type: object
      required:
      - user
      properties:
        user:
          type: string
          format: uuid
    PostMessagePayload:
      type: object
      required:
      - content
      properties:
        content:
          type: string
    PostServerPayload:
      type: object
      required:
      - name
      properties:
        icon:
          type:
          - string
          - 'null'
        name:
          type: string
    PutFriendRequest:
      type: object
      required:
      - action
      properties:
        action:
          $ref: '#/components/schemas/RequestAction'
    PutRolePayload:
      type: object
      required:
      - role_id
      - target
      properties:
        role_id:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
    RequestAction:
      type: string
      enum:
      - reject
      - accept
    Role:
      type: object
      required:
      - id
      - server_id
      - name
      - mask
      properties:
        bg_color:
          type:
          - string
          - 'null'
        fg_color:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        mask:
          type: integer
          format: int64
        name:
          type: string
        server_id:
          type: string
          format: uuid
    Server:
      type: object
      required:
      - id
      - name
      - owner_id
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        icon:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
    ServerMember:
      type: object
      required:
      - id
      - server_id
      - user_id
      properties:
        id:
          type: string
        server_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
