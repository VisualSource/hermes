openapi: 3.1.0
info:
  title: hermes-server
  description: Hermes server
  license:
    name: ''
  version: 0.1.0
paths:
  /api/v1/channel/{channel}/message:
    post:
      tags:
      - channel
      - message
      operationId: create_message
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessagePayload'
        required: true
      responses:
        '200':
          description: new message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/channel/{channel}/message/{message}:
    get:
      tags:
      - channel
      - message
      operationId: get_message
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: message
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '404':
          description: no such message in this channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
      tags:
      - channel
      - message
      operationId: delete_message
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: message
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: accepted deletion
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    patch:
      tags:
      - channel
      - message
      operationId: patch_message
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: message
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMessagePayload'
        required: true
      responses:
        '201':
          description: accepted update message
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/channel/{channel}/messages:
    get:
      tags:
      - channel
      - message
      description: fetch a cursor paginated list of messages sorted by newest
      operationId: list_messages
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: accepted deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageQueryResult'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/dm-channels:
    get:
      tags:
      - dm
      - channel
      operationId: get_dms
      responses:
        '200':
          description: new channel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DmParticipant'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/friend-request:
    get:
      tags:
      - friend-requests
      operationId: list_friend_requests
      responses:
        '200':
          description: new channel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequest'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    post:
      tags:
      - friend-requests
      operationId: create_friend_request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFriendRequestPayload'
        required: true
      responses:
        '200':
          description: new channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/friend-request/{id}:
    put:
      tags:
      - friend-requests
      operationId: put_friend_request
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutFriendRequest'
        required: true
      responses:
        '201':
          description: action accepted
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '404':
          description: no such friend request addressed to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
      tags:
      - friend-requests
      operationId: delete_friend_request
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: new channel
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server:
    post:
      tags:
      - server
      description: create a server
      operationId: post_server
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostServerPayload'
        required: true
      responses:
        '200':
          description: created server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/join:
    post:
      tags:
      - server
      - invite
      description: join a server by redeeming an invite code
      operationId: join_server
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostJoinServerPayload'
        required: true
      responses:
        '202':
          description: joined the server, or was already a member
        '400':
          description: malformed invite code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '404':
          description: no such invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '410':
          description: invite has been revoked, expired, or is at max uses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}:
    get:
      tags:
      - server
      description: fetch a server
      operationId: get_server
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: single server info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '404':
          description: no such server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
      tags:
      - server
      description: delete a server
      operationId: delete_server
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: server deleted
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    patch:
      tags:
      - server
      description: update a server
      operationId: patch_server
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchServerPayload'
        required: true
      responses:
        '201':
          description: updated server properties
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/channel:
    post:
      tags:
      - channel
      description: create a channel on the given server
      operationId: create_channel
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelPayload'
        required: true
      responses:
        '200':
          description: new channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '403':
          description: missing MANAGE_CHANNELS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/channel/{channel}:
    get:
      tags:
      - channel
      description: fetch a channel attached to the given server
      operationId: get_channel
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: accepted changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '403':
          description: missing VIEW_CHANNELS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '404':
          description: no such channel in this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
      tags:
      - channel
      description: delete a channel attached to the given server
      operationId: delete_channel
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: accepted deletion
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '403':
          description: missing MANAGE_CHANNELS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '404':
          description: no such channel in this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    patch:
      tags:
      - channel
      description: update a channel attached to the given server
      operationId: patch_channel
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchChannelPayload'
        required: true
      responses:
        '201':
          description: accepted changes
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '403':
          description: missing MANAGE_CHANNELS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '404':
          description: no such channel in this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/channels:
    get:
      tags:
      - server
      - channels
      operationId: list_channels
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: list of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerMember'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/invite:
    post:
      tags:
      - server
      - invite
      operationId: create_invite
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitePayload'
        required: true
      responses:
        '200':
          description: created server invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '403':
          description: missing CREATE_INVITE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/invite-revoke:
    delete:
      tags:
      - server
      - invite
      operationId: revoke_invite
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: accepted revoked
        '400':
          description: malformed invite id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '403':
          description: missing MANAGE_INVITES
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/kick:
    post:
      tags:
      - server
      - users
      operationId: kick_user_from_server
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostKickUserPayload'
        required: true
      responses:
        '204':
          description: kicked user from server
        '400':
          description: owner can not be kicked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '403':
          description: missing MANAGE_USERS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/leave:
    post:
      tags:
      - server
      - users
      operationId: leave_server
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: left server
        '400':
          description: owner can not leave their own server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '404':
          description: no such server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/members:
    get:
      tags:
      - server
      - members
      description: server members list
      operationId: list_members
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: list of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerMember'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/role:
    put:
      tags:
      - server
      - role
      description: add role to user
      operationId: add_role_to_user
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRolePayload'
        required: true
      responses:
        '201':
          description: adding accepted
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '403':
          description: missing ADD_ROLE, or the role grants permissions the caller lacks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '404':
          description: no such role or member in this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    post:
      tags:
      - server
      - role
      description: create a role
      operationId: create_role
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRolePayload'
        required: true
      responses:
        '200':
          description: role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
