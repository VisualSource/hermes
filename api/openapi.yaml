openapi: 3.1.0
info:
  title: hermes-server
  description: Hermes server
  license:
    name: ''
  version: 0.1.0
paths:
  /api/v1/channel:
    post:
      tags:
      - channel
      operationId: create_channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelPayload'
        required: true
      responses:
        '200':
          description: new channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/channel/{channel}:
    get:
      tags:
      - channel
      operationId: get_channel
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: accepted changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
      tags:
      - channel
      operationId: delete_channel
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: accepted deletion
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    patch:
      tags:
      - channel
      operationId: patch_channel
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchChannelPayload'
        required: true
      responses:
        '201':
          description: accepted changes
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/channel/{channel}/message:
    post:
      tags:
      - channel
      - message
      operationId: create_message
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessagePayload'
        required: true
      responses:
        '200':
          description: new message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/channel/{channel}/message/{message}:
    get:
      tags:
      - channel
      - message
      operationId: get_message
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: message
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
      tags:
      - channel
      - message
      operationId: delete_message
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: message
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: accepted deletion
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    patch:
      tags:
      - channel
      - message
      operationId: patch_message
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: message
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMessagePayload'
        required: true
      responses:
        '201':
          description: accepted update message
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/channel/{channel}/messages:
    get:
      tags:
      - channel
      - message
      operationId: list_messages
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: accepted deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageQueryResult'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/dm-channels:
    get:
      tags:
      - dm
      - channel
      operationId: get_dms
      responses:
        '200':
          description: new channel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DmParticipant'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '429':
          description: too many request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server:
    post:
      tags:
      - server
      description: create a server
      operationId: post_server
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostServerPayload'
        required: true
      responses:
        '200':
          description: created server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}:
    get:
      tags:
      - server
      description: fetch a server
      operationId: get_server
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: single server info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
      tags:
      - server
      description: delete a server
      operationId: delete_server
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: server deleted
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    patch:
      tags:
      - server
      description: update a server
      operationId: patch_server
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchServerPayload'
        required: true
      responses:
        '201':
          description: updated server properties
        '400':
          description: invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/channels:
    get:
      tags:
      - server
      - channels
      operationId: list_channels
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: list of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerMember'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/members:
    get:
      tags:
      - server
      - members
      description: server members list
      operationId: list_members
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: list of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerMember'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/role:
    put:
      tags:
      - server
      - role
      description: add role to user
      operationId: add_role_to_user
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleQuery'
        required: true
      responses:
        '201':
          description: adding accepted
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    post:
      tags:
      - server
      - role
      description: create a role
      operationId: create_role
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRolePayload'
        required: true
      responses:
        '200':
          description: role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
      tags:
      - server
      - role
      description: remove role from user
      operationId: remove_role_from_user
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRolePayload'
        required: true
      responses:
        '201':
          description: remove accepted
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/server/{server}/role/{role}:
    get:
      tags:
      - server
      - role
      description: get role
      operationId: get_role
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: role
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    delete:
      tags:
      - server
      - role
      description: delete role
      operationId: delete_role
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: role
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: role
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
    patch:
      tags:
      - server
      - role
      description: update a role
      operationId: patch_role
      parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: role
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRolePayload'
        required: true
      responses:
        '201':
          description: role
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /api/v1/servers:
    get:
      tags:
      - server
      - user
      description: list servers that the current user is in
      operationId: list_servers
      responses:
        '200':
          description: created server
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
components:
  schemas:
    ApplicationError:
      type: object
      required:
      - code
      - message
      - target
      - details
      properties:
        code:
          type: integer
          format: int32
          minimum: 0
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        innererror:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InnerError'
        message:
          type: string
        target:
          type: string
    Channel:
      type: object
      required:
      - id
      - kind
      - name
      properties:
        category:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChannelKind'
        name:
          type: string
        server_id:
          type:
          - string
          - 'null'
          format: uuid
    ChannelKind:
      type: string
      enum:
      - text
      - voice
      - dm
    CreateChannelPayload:
      type: object
      required:
      - name
      - kind
      - server_id
      properties:
        category:
          type:
          - string
          - 'null'
        kind:
          $ref: '#/components/schemas/ChannelKind'
        name:
          type: string
        server_id:
          type: string
          format: uuid
    CreateRolePayload:
      type: object
      required:
      - name
      properties:
        bg_color:
          type:
          - string
          - 'null'
        fg_color:
          type:
          - string
          - 'null'
        name:
          type: string
    DmParticipant:
      type: object
      description: link info for a channel(dm)
      required:
      - id
      - channel_id
      - user_a_id
      - user_b_id
      properties:
        channel_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        user_a_id:
          type: string
          format: uuid
        user_b_id:
          type: string
          format: uuid
    ErrorDetail:
      type: object
      required:
      - code
      - target
      - message
      properties:
        code:
          type: integer
          format: int32
          minimum: 0
        message:
          type: string
        target:
          type: string
    InnerError:
      type: object
      required:
      - trace
      properties:
        trace:
          type: array
          items:
            type: string
    Message:
      type: object
      required:
      - id
      - channel_id
      - content
      - created_at
      properties:
        channel_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        user_id:
          type:
          - string
          - 'null'
          format: uuid
    MessageQueryResult:
      type: object
      required:
      - results
      - count
      properties:
        count:
          type: integer
          minimum: 0
        cursor:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    PatchChannelPayload:
      type: object
      properties:
        category:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    PatchMessagePayload:
      type: object
      required:
      - content
      properties:
        content:
          type: string
    PatchRolePayload:
      type: object
      properties:
        bg_color:
          type:
          - string
          - 'null'
        fg_color:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    PatchServerPayload:
      type: object
      properties:
        icon:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    PostMessagePayload:
      type: object
      required:
      - content
      properties:
        content:
          type: string
    PostServerPayload:
      type: object
      required:
      - name
      properties:
        icon:
          type:
          - string
          - 'null'
        name:
          type: string
    Role:
      type: object
      required:
      - id
      - server_id
      - name
      - mask
      properties:
        bg_color:
          type:
          - string
          - 'null'
        fg_color:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        mask:
          type: integer
          format: int64
        name:
          type: string
        server_id:
          type: string
          format: uuid
    RoleQuery:
      type: object
      required:
      - role_id
      - target
      properties:
        role_id:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
    Server:
      type: object
      required:
      - id
      - name
      - owner_id
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        icon:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
    ServerMember:
      type: object
      required:
      - id
      - server_id
      - user_id
      properties:
        id:
          type: string
        server_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
