[package]
name = "hermes-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hermes-server"
path = "src/main.rs"

[dependencies]
actix-csrf-middleware = "0.5.4"
actix = "0.13"
actix-web = "4"
actix-ws = "0.3"
oxide-auth-actix = "0.3" 
oxide-auth = "0.6"
futures-util = "0.3"
log = "0.4"
sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "macros","migrate","bstr", "time"] }
utoipa = { version = "5.4", features = ["actix_extras"]}
utoipa-actix-web = "0.1"
log4rs = "1.4"
totp-rs = { version = "5.7.0", features = ["gen_secret"]}
dotenvy = "0.15.7"
url = "2.5"
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
argon2 = "0.5.3"
uuid = { version = "1", features = ["v7","serde","fast-rng"] }

[profile.dev.package.sqlx-macros]
opt-level = 3

[profile.release] 
opt-level = "s"  # Optimize for binary size
strip = true  # Remove debug symbols
lto = true  # Enables link to optimizations
panic =  "unwind"  # Strip expensive panic clean-up logic
codegen-units = 1  # Compile crates one after another so the compiler can optimize better
