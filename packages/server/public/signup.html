<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="preconnect" href="https://www.google.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/stylesheet.css">
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="https://www.google.com/recaptcha/enterprise.js?render={RECAPTCHA_SITE_KEY}"></script>
</head>
<body class="dark">
    <dialog id="message-dialog">
        <form method="dialog">
            <p></p>
            <button type="submit">Ok</button>
        </form>
    </dialog>
    <template id="account-created">
        <div data-slot="card" data-size="default" class="card group/card text-center">
             <section data-slot="card-content" class="card-content">
                <h1>Account Created</h1>
                <p>Download the Hermes desktop or mobile app to get started.</p>
             </section>
        </div>
    </template>
    <div class="bg-muted flex min-h-svh flex-col items-center justify-center gap-6 p-6 md:p-10">
        <div class="flex w-full max-w-sm flex-col gap-6">
            <a href="#" class="flex items-center gap-2 self-center font-medium">
                <div class="bg-primary text-primary-foreground flex size-6 items-center justify-center rounded-md">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-gallery-vertical-end size-4">
                        <path d="M7 2h10"></path>
                        <path d="M5 6h14"></path>
                        <rect width="18" height="12" x="3" y="10" rx="2">
                        </rect>
                    </svg>
                </div>
                Hermes
            </a>
            <main class="flex flex-col gap-6">
                <div data-slot="card" data-size="default" class="card group/card text-center">
                    <header data-slot="card-header" class="card-header group/card-header">
                        <div data-slot="card-title" class="card-title text-xl">Create your account</div>
                        <div data-slot="card-description">Enter your email below to create your account</div>
                    </header>
                    <section data-slot="card-content" class="card-content">
                        <form id="signup-form">
                            <input type="hidden" name="{CSRF_TOKEN_FIELD}" value="{CSRF_TOKEN_VALUE}" />
                            <div data-slot="field-group" class="field-group group/field-group">
                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                    <label class="field-label group/field-label peer/field-label" data-slot="field-label" for="username">Username</label>
                                    <input id="username" name="username" class="input" data-slot="input" minlength="4" maxlength="255" required type="text" placeholder="Hermes"/>
                                    <div id="username-errors" role="alert" data-slot="field-error" class="field-error hidden">
                                        <ul></ul>
                                    </div>
                                </div>
                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                    <label class="field-label group/field-label peer/field-label" for="email" data-slot="field-label">Email</label>
                                    <input id="email" name="email" class="input" data-slot="input" type="email" placeholder="user@hermes.com" required />
                                    <div id="email-errors" role="alert" data-slot="field-error" class="field-error hidden">
                                        <ul></ul>
                                    </div>
                                </div>
                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                    <div data-slot="field" role="group" data-orientation="vertical" class="field group/field grid grid-cols-2 gap-4">
                                        <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                            <label class="field-label group/field-label peer/field-label" data-slot="field-label" for="password">Password</label>
                                            <input id="password" name="password" type="password" class="input" required minlength="8" maxlength="384"/>
                                            <div id="password-errors" role="alert" data-slot="field-error" class="field-error hidden">
                                                <ul></ul>
                                            </div>
                                        </div>
                                        <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                            <label class="field-label group/field-label peer/field-label" data-slot="field-label" for="confirm-password">Confirm Password</label>
                                            <input id="confirm-password" name="confirm-password" type="password" class="input" required minlength="8" maxlength="384"/>
                                             <div id="confirm-password-errors" role="alert" data-slot="field-error" class="field-error hidden">
                                                <ul></ul>
                                            </div>
                                        </div>
                                    </div>
                                    <div data-slot="field-description" class="field-description">
                                        Must be at least 8 characters long.
                                    </div>
                                </div>
                                <div id="body-errors" role="alert" data-slot="field-error" class="field-error hidden">
                                    <ul></ul>
                                </div>
                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                    <button id="submitBtn" data-variant="default" data-size="default" data-slot="button" type="submit" class="btn group/button">
                                        Create Account
                                        <svg role="status" aria-label="Loading" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-circle-icon lucide-loader-circle animate-spin size-4 hidden"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                                    </button>
                                    <div data-slot="field-description" class="field-description text-center">
                                        Already have an account? <a href="/login">Sign in</a>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </section>
                </div>
                <div data-slot="field-description" class="field-description px-6 text-center">
                    By clicking continue, you agree to our <a href="/terms-of-service">Terms of Service</a> and <a href="/privacy-policy">Privacy Policy</a>.
                </div>
            </main>
        </div>
    </div>
    <script type="module">
        import { reportError, onFormSubmit, getRecaptchaToken, handleErrorResponse, showMessage } from "/static/shared.js";
        document.addEventListener("DOMContentLoaded",()=>{
            const passwordCheck = () => {
                const psd = document.getElementById("password");
                const psdCof = document.getElementById("confirm-password");
                psdCof?.addEventListener("input",(ev)=>{
                    const isSame = psd.value === ev.target.value;
                    psdCof.setCustomValidity(isSame ? "" : "Passwords do not match");
                    psdCof.reportValidity();
                });
            }
            passwordCheck();
            reportError(["username","password","confirm-password"]);

            const submitBtn = document.getElementById("submitBtn");
            const spinner = submitBtn.querySelector("svg");

            onFormSubmit("signup-form",async (formData)=> {
                const path = new URL("/signup",window.location.origin);
                path.search = window.location.search;

                try {
			        document.getElementById("body-errors")?.classList.add("hidden");
                    submitBtn.setAttribute("disabled","true");
                    spinner.classList.remove("hidden");
                    const token = await getRecaptchaToken("{RECAPTCHA_SITE_KEY}","signup");

                    formData.set("recaptcha",token);
                    formData.delete("confirm-password");

                    const response = await fetch(path,{
                        method: "POST",
                        body: new URLSearchParams(formData.entries()),
                    });

                    if(!response.ok) {
                        await handleErrorResponse(response);
                        return;
                    }

                    if(response.status === 202) {
                        const temp = document.getElementById("account-created");
                        const content = temp.cloneNode(true);
                        content.querySelector("h1").textContent = "Account Created";
                        context.querySelector("p").textContent = "Download the Hermes desktop or mobile app to get started.";
                        const target = document.querySelector("main");
                        target.replaceChildren(content);
                        return;
                    }

                    const body = await response.json();
                    window.location.href = body.redirect;

                    const temp = document.getElementById("account-created");
                    const content = temp.cloneNode(true);

                    content.querySelector("h1").textContent = "Opening Hermes";
                    context.querySelector("p").textContent = "Returning you to the app";

                    const target = document.querySelector("main");
                    target.replaceChildren(content);

                } catch (error) {
                    console.error(error);

                    if(error instanceof Response) {
                        const body = error.json();
                        showMessage(body.message);
                    }

                } finally {
                    submitBtn.removeAttribute("disabled");
                    spinner.classList.add("hidden");
                }
            });
        });
    </script>
</body>
</html>
