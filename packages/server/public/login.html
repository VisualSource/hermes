<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://www.google.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/stylesheet.css">
    <script src="https://www.google.com/recaptcha/enterprise.js?render={RECAPTCHA_SITE_KEY}"></script>
</head>
<body class="dark">
    <dialog id="message-dialog" class="backdrop:bg-black/10 backdrop:supports-backdrop-filter:backdrop-blur-xs">
        <form method="dialog" data-slot="alert-dialog-content" data-size="default" class="dialog-content group/alert-dialog-content">
            <header data-slot="alert-dialog-header" class="dialog-header">
                <h1 data-slot="alert-dialog-title" class="dialog-title">Error</h1>
                <p data-slot="alert-dialog-description" class="dialog-description"></p>
            </header>
            <footer data-slot="alert-dialog-footer" class="dialog-footer">
                <button data-variant="default" data-size="default" data-slot="button" type="submit" class="btn group/button">
                    Ok
                </button>
            </footer>
        </form>
    </dialog>
     <template id="login-done">
        <div data-slot="card" data-size="default" class="card group/card text-center">
             <section data-slot="card-content" class="card-content">
                <h1 class="text-lg font-bold">Your loggedin.</h1>
                <p class="text-muted-foreground mt-4">
                    If the app doesn't open try <a class="underline text-primary-foreground" href="hermes://open">clicking here</a>
                </p>
             </section>
        </div>
    </template>
    <div class="bg-muted flex min-h-svh w-full items-center justify-center p-6 md:p-10">
        <div class="w-full max-w-sm">
            <main class="flex flex-col gap-6">
                <div data-slot="card" data-size="default" class="card group/card">
                    <header data-slot="card-header" class="card-header group/card-header">
                        <div data-slot="card-title" class="card-title">Login to your account</div>
                        <div data-slot="card-description" class="card-description">Enter your username below to login to your account.</div>
                    </header>
                    <section data-slot="card-content" class="card-content">
                        <form id="login-form">
                            <input type="hidden" name="{CSRF_TOKEN_FIELD}" value="{CSRF_TOKEN_VALUE}" />
                            <div data-slot="field-group" class="field-group group/field-group">
                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                    <label for="username" class="field-label group/field-label peer/field-label" data-slot="field-label">Username</label>
                                    <input class="input" data-slot="input" id="username" name="username" type="text" minlength="4" maxlength="255" placeholder="hermes" required/>
                                     <div id="username-errors" role="alert" data-slot="field-error" class="field-error hidden">
                                        <ul></ul>
                                    </div>
                                </div>
                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                    <div class="flex items-center">
                                        <label for="password" class="field-label group/field-label peer/field-label" data-slot="field-label">Password</label>
                                        <a href="/forget-psd" class="ml-auto text-sm underline-offset-2 hover:underline">Forgot your password?</a>
                                    </div>
                                    <input class="input" data-slot="input" id="password" name="password" required type="password" minlength="8" maxlength="384"/>
                                    <div id="password-errors" role="alert" data-slot="field-error" class="field-error hidden">
                                        <ul></ul>
                                    </div>
                                </div>
                                <div id="body-errors" role="alert" data-slot="field-error" class="field-error hidden">
                                        <ul></ul>
                                    </div>
                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                    <button id="submitBtn" data-variant="default" data-size="default" data-slot="button" type="submit" class="btn group/button">
                                        Login
                                        <svg role="status" aria-label="Loading" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-circle-icon lucide-loader-circle animate-spin size-4 hidden"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                                    </button>
                                </div>
                                <div data-slot="field-description" class="field-description text-center">
                                    Don&apos;t have an account? <a href="/signup" id="signup-link">Sign up</a>
                                </div>
                            </div>
                        </form>
                    </section>
                </div>
                <div data-slot="field-description" class="field-description px-6 text-center">
                    By clicking continue, you agree to our <a href="/terms-of-service" rel="terms-of-service">Terms of Service</a> and <a href="/privacy-policy" rel="privacy-policy">Privacy Policy</a>.
                </div>
            </main>
        </div>
    </div>
    <script type="module">
        import {onFormSubmit,reportError,getRecaptchaToken, handleErrorResponse,  showMessage} from "/static/shared.js";
        document.addEventListener("DOMContentLoaded",()=>{
            reportError(["username","password"]);

            const submitBtn = document.getElementById("submitBtn");
            const spinner = submitBtn.querySelector("svg");

            /**@type {HTMLAnchorElement|null}*/
            const link = document.getElementById("signup-link");
            if(link){
                link.href = `${link.href}${window.location.search}`;
            }

            onFormSubmit("login-form",async (formData)=>{
                const path = new URL("/login",window.location.origin);
     
                try {
                    document.getElementById("body-errors")?.classList.add("hidden");
                    submitBtn.setAttribute("disabled","true");
                    spinner.classList.remove("hidden");

                    const token = await getRecaptchaToken("{RECAPTCHA_SITE_KEY}","login");
                    formData.set("recaptcha",token);

                    const response = await fetch(path,{
                        method: "post",
                        body: new URLSearchParams(formData.entries()),
                        credentials: "same-origin"
                    });

                    if(!response.ok) {
                        await handleErrorResponse(response);
                        return;
                    }

                    const template = document.getElementById("login-done");
                    const clone = document.importNode(template.content,true);
                    document.querySelector("main").replaceChildren(clone);

                   try {
                      const query = new URLSearchParams(window.location.search);
                      const returnTo = query.get("return_to");
                        if(!returnTo) return;
                      const url = new URL(returnTo);
                      if(url.origin !== window.location.origin) return;
                      window.location.href = url.toString();
                   } catch (error) {
                     console.error(error);
                   }
                } catch (error) {
                    console.error("error");
                    showMessage(typeof error === "object" && "message" in error ? error.message : "Unknown error");
                } finally {
                    submitBtn.removeAttribute("disabled");
                    spinner.classList.add("hidden");
                }
            });
        });
    </script>
</body>
</html>
