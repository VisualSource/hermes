<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Login</title>
</head>
<body>
    <h1>Hermes Login</h1>
    <form action="" method="POST">
        <input type="hidden" name="{CSRF_TOKEN_FIELD}" value="{CSRF_TOKEN_VALUE}" />

        <label>Username</label>
        <input type="text" name="username" autocomplete="username" minlength="5" maxlength="255"/>
        <label>Password</label>
        <input type="password" name="password" autocomplete="password" minlength="8" maxlength="255"/>
        <button type="submit">Login</button>
    </form>
    <span>Don't have an account client <a href="/signup">click here</a></span>
</body>
</html>
