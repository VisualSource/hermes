<body class="dark">
    <div class="bg-muted flex min-h-svh flex-col items-center justify-center gap-6 p-6 md:p-10">
        <div class="flex w-full max-w-sm flex-col gap-6">
            <a href="/login" class="flex items-center gap-2 self-center font-medium">
                <div class="bg-primary text-primary-foreground flex size-6 items-center justify-center rounded-md"></div>
                Hermes
            </a>
            <div class="flex flex-col gap-6">
                <div data-type="card" class="ring-foreground/10 bg-card text-card-foreground gap-4 overflow-hidden rounded-xl py-4 text-sm ring-1 has-data-[slot=card-footer]:pb-0 has-[>img:first-child]:pt-0 data-[size=sm]:gap-3 data-[size=sm]:py-3 data-[size=sm]:has-data-[slot=card-footer]:pb-0 *:[img:first-child]:rounded-t-xl *:[img:last-child]:rounded-b-xl group/card flex flex-col">

                        <h1 data-slot="card-title" class="text-base leading-snug font-medium group-data-[size=sm]/card:text-sm">Create your account</h1>
                        <p data-slot="card-description" class="text-muted-foreground text-sm">
                            Enter your email below to create your account
                        </p>
                    </div>
                    <div data-slot="card-content" class="px-4 group-data-[size=sm]/card:px-3">
                        <form method="POST">
                            <input name="{CSRF_TOKEN_FIELD}" value="{CSRF_TOKEN_VALUE}" type="hidden"/>
                            <div data-slot="field-group" class="gap-5 data-[slot=checkbox-group]:gap-3 *:data-[slot=field-group]:gap-4 group/field-group @container/field-group flex w-full flex-col">
                                <div data-slot="field" role="group" class="data-[invalid=true]:text-destructive gap-2 group/field flex w-full flex-col *:w-full [&>.sr-only]:w-auto">
                                    <label for="username">Username</label>
                                    <input id="username" type="text" placeholder="hermes" required minlength="4" maxlength="255" class="dark:bg-input/30 border-input focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 disabled:bg-input/50 dark:disabled:bg-input/80 h-8 rounded-lg border bg-transparent px-2.5 py-1 text-base transition-colors file:h-6 file:text-sm file:font-medium focus-visible:ring-3 aria-invalid:ring-3 md:text-sm file:text-foreground placeholder:text-muted-foreground w-full min-w-0 outline-none file:inline-flex file:border-0 file:bg-transparent disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50"/>
                                </div>
                                <div data-slot="field" role="group" class="data-[invalid=true]:text-destructive gap-2 group/field flex w-full flex-col *:w-full [&>.sr-only]:w-auto">
                                    <label for="email">Email</label>
                                    <input id="email" type="email" required placeholder="email@hermes.com" class="dark:bg-input/30 border-input focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 disabled:bg-input/50 dark:disabled:bg-input/80 h-8 rounded-lg border bg-transparent px-2.5 py-1 text-base transition-colors file:h-6 file:text-sm file:font-medium focus-visible:ring-3 aria-invalid:ring-3 md:text-sm file:text-foreground placeholder:text-muted-foreground w-full min-w-0 outline-none file:inline-flex file:border-0 file:bg-transparent disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50"/>
                                </div>
                                <div data-slot="field" role="group" class="data-[invalid=true]:text-destructive gap-2 group/field flex w-full flex-col *:w-full [&>.sr-only]:w-auto">
                                    <div data-slot="field" role="group" class="data-[invalid=true]:text-destructive gap-2 group/field grid grid-cols-2 gap-4 w-full *:w-full [&>.sr-only]:w-auto">
                                        <div data-slot="field" class="data-[invalid=true]:text-destructive gap-2 group/field flex w-full flex-col *:w-full [&>.sr-only]:w-auto">
                                            <label for="password">Password</label>
                                            <input id="password" type="password" required minlength="8" class="dark:bg-input/30 border-input focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 disabled:bg-input/50 dark:disabled:bg-input/80 h-8 rounded-lg border bg-transparent px-2.5 py-1 text-base transition-colors file:h-6 file:text-sm file:font-medium focus-visible:ring-3 aria-invalid:ring-3 md:text-sm file:text-foreground placeholder:text-muted-foreground w-full min-w-0 outline-none file:inline-flex file:border-0 file:bg-transparent disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50"/>
                                        </div>
                                        <div data-slot="field" role="group" class="data-[invalid=true]:text-destructive gap-2 group/field flex w-full flex-col *:w-full [&>.sr-only]:w-auto">
                                            <label for="confirm-password">Confirm Password</label>
                                            <input id="confirm-password" required type="password" class="dark:bg-input/30 border-input focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 disabled:bg-input/50 dark:disabled:bg-input/80 h-8 rounded-lg border bg-transparent px-2.5 py-1 text-base transition-colors file:h-6 file:text-sm file:font-medium focus-visible:ring-3 aria-invalid:ring-3 md:text-sm file:text-foreground placeholder:text-muted-foreground w-full min-w-0 outline-none file:inline-flex file:border-0 file:bg-transparent disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50"/>
                                        </div>
                                    </div>
                                    <p data-slot="field-description" class="[&>a:hover]:text-primary [&>a]:underline [&>a]:underline-offset-4 last:mt-0 nth-last-2:-mt-1 text-muted-foreground text-left text-sm [[data-variant=legend]+&]:-mt-1.5 leading-normal font-normal group-has-data-horizontal/field:text-balance">
                                        Must be at least 8 characters long.
                                    </p>
                                </div>
                                <div data-slot="field" role="group" class="data-[invalid=true]:text-destructive gap-2 group/field fgrid grid-cols-2 gap-4 w-full *:w-full [&>.sr-only]:w-auto">
                                    <button type="submit" class="focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive dark:aria-invalid:border-destructive/50 rounded-lg border border-transparent bg-clip-padding text-sm font-medium focus-visible:ring-3 aria-invalid:ring-3 [&_svg:not([class*='size-'])]:size-4 inline-flex items-center justify-center whitespace-nowrap transition-all disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none shrink-0 [&_svg]:shrink-0 outline-none group/button select-none bg-primary text-primary-foreground [a]:hover:bg-primary/80 h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2">Create Account</button>
                                    <p data-type="field-description" class="text-center [&>a:hover]:text-primary [&>a]:underline [&>a]:underline-offset-4 last:mt-0 nth-last-2:-mt-1 text-muted-foreground text-left text-sm [[data-variant=legend]+&]:-mt-1.5 leading-normal font-normal group-has-data-horizontal/field:text-balance">
                                         Already have an account? <a href="/login">Sign in</a>
                                    </p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <p data-type="field-description" class="px-6 text-center [&>a:hover]:text-primary [&>a]:underline [&>a]:underline-offset-4 last:mt-0 nth-last-2:-mt-1 text-muted-foreground text-left text-sm [[data-variant=legend]+&]:-mt-1.5 leading-normal font-normal group-has-data-horizontal/field:text-balance">
                    By clicking continue, you agree to our <a href="/terms-of-service" class="underline">Terms of Service</a> 
                    and <a href="/privacy-policy" class="underline">Privacy Policy</a>.
                </p>
            </div>
        </div>
    </div>
    <script type="module">
        document.addEventListener("DOMContentLoaded",()=>{
            /** @type {HTMLInputElement|null} */
            let psd = document.getElementById("password");
            /** @type {HTMLInputElement|null} */
            let psdCof = document.getElementById("confirm-password");
            
            psdCof?.addEventListener("change",(ev)=>{
                if(psd.value != ev.target.value){
                    psdCof.setCustomValidity("Passwords do not match");        
                } else {
                    psdCof.setCustomValidity("");
                }
                psdCof.reportValidity();
            });

        });
    </script>
</body>
