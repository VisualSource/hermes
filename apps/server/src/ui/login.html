<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/stylesheet.css">
    <script type="importmap">{"imports":{"alpinejs": "/static/alpinejs.esm.min.js"}}</script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="/static/login.js"></script>
</head>
<body class="dark">
    <dialog id="message-dialog" class="backdrop:bg-black/10 backdrop:supports-backdrop-filter:backdrop-blur-xs">
        <form method="dialog" data-slot="alert-dialog-content" data-size="default" class="dialog-content group/alert-dialog-content">
            <header data-slot="alert-dialog-header" class="dialog-header" x-data>
                <h1 data-slot="alert-dialog-title" class="dialog-title" x-text="$store.app.dialog.title">Error</h1>
                <p data-slot="alert-dialog-description" class="dialog-description" x-text="$store.app.dialog.desc"></p>
            </header>
            <footer data-slot="alert-dialog-footer" class="dialog-footer">
                <button data-variant="default" data-size="default" data-slot="button" type="submit" class="btn group/button">
                    Ok
                </button>
            </footer>
        </form>
    </dialog>
    <div class="bg-muted flex min-h-svh w-full items-center justify-center p-6 md:p-10">
        <div class="w-full max-w-sm" x-data>
            <template x-if="$store.app.done">
                <div data-slot="card" data-size="default" class="card group/card text-center">
                    <section data-slot="card-content" class="card-content">
                        <h1 class="text-lg font-bold">Your loggedin.</h1>
                        <p class="text-muted-foreground mt-4">
                            If the app doesn't open try <a class="underline text-primary-foreground" href="hermes://open">clicking here</a>
                        </p>
                    </section>
                </div>
            </template>
            <main class="flex flex-col gap-6" x-show="!$store.app.done">
                <div data-slot="card" data-size="default" class="card group/card">
                    <header data-slot="card-header" class="card-header group/card-header">
                        <div data-slot="card-title" class="card-title">Login to your account</div>
                        <div data-slot="card-description" class="card-description">Enter your username below to login to your account.</div>
                    </header>
                    <section data-slot="card-content" class="card-content">
                        <form id="login-form" @submit.prevent="submit($event)" x-data="appForm">
                            <input type="hidden" name="CSRF_TOKEN_FIELD" value="{CSRF_TOKEN_VALUE}" />
                            <div data-slot="field-group" class="field-group group/field-group">
                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical" x-data="field">
                                    <label for="username" class="field-label group/field-label peer/field-label" data-slot="field-label">Username</label>
                                    <input @invalid.prevent="" @input="onInput" class="input" data-slot="input" id="username" name="username" type="text" minlength="4" maxlength="255" placeholder="hermes" required autocomplete="username"/>
                                     <div id="username-errors" role="alert" data-slot="field-error" class="field-error" x-show="hasErrors" x-transition>
                                        <ul>
                                            <template x-for="err in errors">
                                                <li>
                                                    <span x-text="err"></span>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </div>
                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical" x-data="field">
                                    <div class="flex items-center">
                                        <label for="password" class="field-label group/field-label peer/field-label" data-slot="field-label">Password</label>
                                        <a href="/forget-psd" class="ml-auto text-sm underline-offset-2 hover:underline">Forgot your password?</a>
                                    </div>
                                    <input @invalid.prevent="" @input="onInput" class="input" data-slot="input" id="password" name="password" required type="password" minlength="8" maxlength="384" autocomplete="current-password"/>
                                    <div id="password-errors" role="alert" data-slot="field-error" class="field-error" x-show="hasErrors" x-transition>
                                          <ul>
                                            <template x-for="err in errors">
                                                <li>
                                                    <span x-text="err"></span>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </div>

                                <div class="cf-turnstile" data-sitekey="{CLOUDFLARE_TURNSTILE_SITE_KEY}" data-theme="dark" data-size="flexible" data-appearance="interaction-only" data-action="login"></div>

                                <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                    <button :disabled="pending" id="submitBtn" data-variant="default" data-size="default" data-slot="button" type="submit" class="btn group/button">
                                        Login
                                        <template x-if="pending">
                                            <svg role="status" aria-label="Loading" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-circle-icon lucide-loader-circle animate-spin size-4">
                                                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                                            </svg>
                                        </template>
                                    </button>
                                </div>
                                <div data-slot="field-description" class="field-description text-center">
                                    Don&apos;t have an account? <a :href="`/signup${window.location.search}`">Sign up</a>
                                </div>
                            </div>
                        </form>
                    </section>
                </div>
                <div data-slot="field-description" class="field-description px-6 text-center">
                    By clicking continue, you agree to our <a href="/terms-of-service" rel="terms-of-service">Terms of Service</a> and <a href="/privacy-policy" rel="privacy-policy">Privacy Policy</a>.
                </div>
            </main>
        </div>
    </div>
</body>
</html>
