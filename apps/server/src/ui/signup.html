<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <link rel="stylesheet" href="/static/stylesheet.css">
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <script type="importmap">{"imports":{"alpinejs": "/static/alpinejs.esm.min.js"}}</script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="/static/signup.js"></script>
</head>
<body class="dark">
    <dialog id="message-dialog" class="backdrop:bg-black/10 backdrop:supports-backdrop-filter:backdrop-blur-xs">
        <form method="dialog" data-slot="alert-dialog-content" data-size="default" class="dialog-content group/alert-dialog-content">
            <header data-slot="alert-dialog-header" class="dialog-header" x-data>
                <h1 data-slot="alert-dialog-title" class="dialog-title" x-text="$store.app.dialog.title">Error</h1>
                <p data-slot="alert-dialog-description" class="dialog-description" x-text="$store.app.dialog.desc"></p>
            </header>
            <footer data-slot="alert-dialog-footer" class="dialog-footer">
                <button data-variant="default" data-size="default" data-slot="button" type="submit" class="btn group/button">
                    Ok
                </button>
            </footer>
        </form>
    </dialog>
    <div class="bg-muted flex min-h-svh flex-col items-center justify-center gap-6 p-6 md:p-10">
        <div class="flex w-full max-w-sm flex-col gap-6">
            <a href="#" class="flex items-center gap-2 self-center font-medium">
                <div class="bg-primary text-primary-foreground flex size-6 items-center justify-center rounded-md">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-gallery-vertical-end size-4">
                        <title>Logo</title>
                        <path d="M7 2h10"></path>
                        <path d="M5 6h14"></path>
                        <rect width="18" height="12" x="3" y="10" rx="2">
                        </rect>
                    </svg>
                </div>
                Hermes
            </a>
            <main class="flex flex-col gap-6" x-data>
                <template id="account-created" x-if="$store.app.done">
                    <div data-slot="card" data-size="default" class="card group/card text-center">
                        <section data-slot="card-content" class="card-content">
                            <h1 class="text-lg font-bold" x-text="$store.signupState.title"></h1>
                            <p class="text-muted-foreground mt-4" x-text="$store.signupState.desc"></p>
                            <template x-if="$store.signupState.open">
                                If app doesn't open <a :href="$store.signupState.openRoute" class="underline text-primary-foreground">click here</a>
                            </template
                        </section>
                    </div>
                </template>

                <div class="flex flex-col" x-show="!$store.app.done">
                    <div data-slot="card" data-size="default" class="card group/card text-center">
                        <header data-slot="card-header" class="card-header group/card-header">
                            <div data-slot="card-title" class="card-title text-xl">Create your account</div>
                            <div data-slot="card-description">Enter your email below to create your account</div>
                        </header>
                        <section data-slot="card-content" class="card-content">
                            <form @submit.prevent="onSubmit" x-data="appForm">
                                <input type="hidden" name="CSRF_TOKEN_FIELD" value="{CSRF_TOKEN_VALUE}" />
                                <div data-slot="field-group" class="field-group group/field-group">
                                    <div class="field group/field" data-slot="field" role="group" data-orientation="vertical" x-data="field">
                                        <label class="field-label group/field-label peer/field-label" data-slot="field-label" for="username">Username</label>
                                        <input @invalid.prevent="" @input="onInput" autocomplete="username" name="username" class="input" data-slot="input" minlength="4" maxlength="255" required type="text" placeholder="Hermes"/>
                                         <div role="alert" data-slot="field-error" class="field-error" x-show="hasErrors" x-transition>
                                            <ul>
                                                <template x-for="err in errors">
                                                    <li x-text="err"></li>
                                                </template>
                                            </ul>
                                        </div>
                                    </div>
                                    <div class="field group/field" data-slot="field" role="group" data-orientation="vertical" x-data="field">
                                        <label class="field-label group/field-label peer/field-label" for="email" data-slot="field-label">Email</label>
                                        <input @invalid.prevent="" @input="onInput" autocomplete="email" name="email" class="input" data-slot="input" type="email" placeholder="user@hermes.com" required />
                                        <div role="alert" data-slot="field-error" class="field-error" x-show="hasErrors" x-transition>
                                            <ul>
                                                <template x-for="err in errors">
                                                    <li x-text="err"></li>
                                                </template>
                                            </ul>
                                        </div>
                                    </div>
                                    <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                        <div data-slot="field" role="group" data-orientation="vertical" class="field group/field grid grid-cols-2 gap-4">
                                            <div class="field group/field" data-slot="field" role="group" data-orientation="vertical" x-data="field">
                                                <label class="field-label group/field-label peer/field-label" data-slot="field-label" for="password">Password</label>
                                                <input id="psd" @invalid.prevent="" @input="onInput" autocomplete="new-password" name="password" type="password" class="input" required minlength="8" maxlength="384"/>
                                                <div role="alert" data-slot="field-error" class="field-error" x-show="hasErrors" x-transition>
                                                    <ul>
                                                        <template x-for="err in errors">
                                                            <li x-text="err"></li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </div>
                                            <div class="field group/field" data-slot="field" role="group" data-orientation="vertical" x-data="checker">
                                                <label class="field-label group/field-label peer/field-label" data-slot="field-label" for="confirm-password">Confirm Password</label>
                                                <input @invalid.prevent="" @input="onInput" autocomplete="new-password" name="psd-check" type="password" class="input" required minlength="8" maxlength="384"/>
                                                <div role="alert" data-slot="field-error" class="field-error" x-show="hasErrors" x-transition>
                                                    <ul>
                                                        <template x-for="err in errors">
                                                            <li x-text="err"></li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                        <div data-slot="field-description" class="field-description">
                                            Must be at least 8 characters long.
                                        </div>
                                    </div>

                                    <div class="cf-turnstile" data-response-field-name="cf_token" data-sitekey="{CLOUDFLARE_TURNSTILE_SITE_KEY}" data-theme="dark" data-size="flexible" data-appearance="interaction-only" data-action="login"></div>
                                    
                                    <div class="field group/field" data-slot="field" role="group" data-orientation="vertical">
                                        <button :disabled="pending" id="submitBtn" data-variant="default" data-size="default" data-slot="button" type="submit" class="btn group/button">
                                            Create Account
                                            <template x-if="pending">
                                                <svg role="status" aria-label="Loading" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-circle-icon lucide-loader-circle animate-spin size-4 hidden">
                                                    <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                                                </svg>
                                            </template>
                                        </button>
                                        <div data-slot="field-description" class="field-description text-center">
                                            Already have an account? <a :href="`/login${window.location.search}`" href="/login">Sign in</a>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </section>
                    </div>
                    <div data-slot="field-description" class="field-description px-6 text-center">
                        By clicking continue, you agree to our <a href="/terms-of-service">Terms of Service</a> and <a href="/privacy-policy">Privacy Policy</a>.
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
