# Tell the query!/query_as! macros how to map SQL types to Rust types.
# Every BLOB column in this schema stores a UUID, so map BLOB -> uuid::Uuid
# globally. This removes the need for per-column `as "id: Uuid"` overrides.
[macros.type-overrides]
"BLOB" = "uuid::Uuid"

[macros.table-overrides.channels]
kind = "crate::models::channel::ChannelKind"

# example column override
#[macros.table-overrides.attachments]
#data = "Vec<u8>"
