[package]
name = "desktop-client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
opus = "0.3.1"
cpal = "0.17.3"
thiserror = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
log = "0.4"
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-upload = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-http = "2"

# Source must be identical across target tables (Cargo requires one canonical
# source per dependency), but features may differ. Linux swaps the wry/webkit2gtk
# runtime for CEF; .cargo/config.toml redirects the source to the branch
# that provides the `cef` feature.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2", default-features = false, features = [
  "cef",
  "compression",
  "dynamic-acl",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
