[package]
name = "hermes-overlay"
version = "0.1.0"
edition = "2024"

# -----------------------------------------------------------------------------
# SPIKE: this crate is currently a throwaway integration spike answering the
# question "do asdf-overlay-client + iced (headless) + nng compose end-to-end?"
# Two binaries:
#   cargo run --bin hermes-overlay -- <target-pid>   # inject + render
#   cargo run --bin mock-publisher                   # fake voice events
# See src/main.rs header for details.
# -----------------------------------------------------------------------------

[[bin]]
name = "hermes-overlay"
path = "src/main.rs"

[[bin]]
name = "mock-publisher"
path = "src/bin/mock_publisher.rs"

[dependencies]
# Injection + IPC to the injected DLL
asdf-overlay-client = "1.2"
asdf-overlay-common = "1.2"

# Async runtime + injection is async
tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0"
sysinfo = "0.39"

# IPC transport for events from the main hermes desktop app
nng = "1.0.1"

# UI stack — iced 0.14 supports headless rendering via iced_wgpu.
# We deliberately skip the umbrella `iced` crate: its default features pull
# iced_winit, wayland, x11, tiny-skia. tiny-skia in particular makes
# iced::Renderer a fallback wrapper over iced_wgpu + iced_tiny_skia, which
# breaks our `iced_wgpu::Renderer::screenshot()` readback path.
iced_core = "0.14"
iced_widget = { version = "0.14", default-features = false, features = ["wgpu"] }
iced_runtime = "0.14"
iced_wgpu = "0.14"
iced_graphics = "0.14"
pollster = "0.4"
bytemuck = "1"

# Shared event schema between publisher + subscriber
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "unwind"
codegen-units = 1
